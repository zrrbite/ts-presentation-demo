# Lefthook configuration
# Replaces bash git hooks with a cleaner, faster alternative

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx}"
      run: oxfmt --check src/
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: npm run type-check
    lint:
      run: npm run lint
    test:
      run: npm run test:run
